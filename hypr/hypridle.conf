# hypridle — dim 5m, lock 10m, screen off 11m, suspend 30m.
# Long-running jobs can hold it off with: systemd-inhibit --what=idle:sleep <cmd>

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = brightnessctl -sd chromeos::kbd_backlight set 0
    on-resume = brightnessctl -rd chromeos::kbd_backlight
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
