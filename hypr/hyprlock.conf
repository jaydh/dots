# hyprlock — password or fingerprint. Colors match waybar.

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning...
        retry_delay = 250
    }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    brightness = 0.6
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgba(24, 24, 32, 0.6)
    outer_color = rgba(89b4faee)
    check_color = rgba(a6e3a1ee)
    fail_color = rgba(f38ba8ee)
    font_color = rgb(205, 214, 244)
    fade_on_empty = false
    rounding = 12
    font_family = $font
    placeholder_text = Password or fingerprint
    fail_text = $PAMFAIL$FPRINTFAIL
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    color = rgb(205, 214, 244)
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    font_size = 22
    font_family = $font
    color = rgb(166, 173, 200)
    position = 0, 110
    halign = center
    valign = center
}

label {
    monitor =
    text = $FPRINTPROMPT
    font_size = 14
    font_family = $font
    color = rgb(166, 173, 200)
    position = 0, -90
    halign = center
    valign = center
}
